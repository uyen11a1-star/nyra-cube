name: Test engine and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine (native)
        run: g++ -O2 -shared -fPIC -o libnyracube.so engine/nyra_cube.cpp
      - name: Test engine
        run: python3 tools/test_cube.py ./libnyracube.so 100

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html app.js style.css cube-worker.js nyra-cube.js nyra-cube.wasm three.module.min.js _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
